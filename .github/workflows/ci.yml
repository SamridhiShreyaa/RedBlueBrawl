name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Neo4j service container. Credentials and ports match src/config.py
    # defaults so the graph tests run against it instead of skipping.
    services:
      neo4j:
        image: neo4j:5.22-community
        env:
          NEO4J_AUTH: neo4j/changeme
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p changeme 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for Neo4j to be ready
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase
          uri, auth = "bolt://localhost:7687", ("neo4j", "changeme")
          last = None
          for attempt in range(1, 31):
              try:
                  driver = GraphDatabase.driver(uri, auth=auth)
                  driver.verify_connectivity()
                  driver.close()
                  print(f"Neo4j ready after {attempt} attempt(s)")
                  break
              except Exception as exc:
                  last = exc
                  print(f"waiting for Neo4j ({attempt})... {exc}")
                  time.sleep(5)
          else:
              raise SystemExit(f"Neo4j never became ready: {last}")
          PY

      - name: Run tests
        run: pytest tests/ -v
